
name: BMS Ticket Checker

on:
  schedule:
    # Runs every 10 minutes, shifted away from the start of the hour.
    - cron: "3,13,23,33,43,53 * * * *"

  workflow_dispatch:
    # Manual runs bypass the randomized scheduling gate.
    
concurrency:
  group: bms-ticket-checker
  cancel-in-progress: false

jobs:
  check-tickets:
    name: Check tickets
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"

      - name: Run checker
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

          BMS_URL: ${{ vars.BMS_URL }}
          BMS_DATES: ${{ vars.BMS_DATES }}
          BMS_THEATRE: ${{ vars.BMS_THEATRE }}
          BMS_SCREEN: ${{ vars.BMS_SCREEN }}
          BMS_TIME: ${{ vars.BMS_TIME }}

          BMS_DEBUG: ${{ vars.BMS_DEBUG }}

          BMS_MIN_INTERVAL: ${{ vars.BMS_MIN_INTERVAL }}
          BMS_MAX_INTERVAL: ${{ vars.BMS_MAX_INTERVAL }}

          BMS_FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}

        run: |
          echo "=================================="
          echo "BMS Ticket Checker"
          echo "UTC Time: $(date -u)"
          echo "IST Time: $(TZ=Asia/Kolkata date)"
          echo "Trigger: ${{ github.event_name }}"
          echo "=================================="

          uv run --with requests --with curl_cffi main.py

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add bms_state.json bms_schedule.json

          if ! git diff --cached --quiet; then
            git commit -m "chore: update bms state/schedule [skip ci]"

            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push

            echo "State successfully committed and pushed."
          else
            echo "No state changes to commit."
          fi
