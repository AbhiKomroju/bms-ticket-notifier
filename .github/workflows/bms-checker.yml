name: BMS Ticket Checker

on:
  schedule:
    # Shift the schedule away from minute 0 to reduce the chance of GitHub
    # Actions scheduler congestion. GitHub can still delay or drop scheduled runs.
    - cron: "3,13,23,33,43,53 * * * *"

  workflow_dispatch:
    # Manual runs bypass the randomized Python scheduling gate.

concurrency:
  group: bms-ticket-checker
  cancel-in-progress: false

jobs:
  check-tickets:
    name: Check tickets
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"

      - name: Run checker
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

          BMS_URL: ${{ vars.BMS_URL }}
          BMS_DATES: ${{ vars.BMS_DATES }}
          BMS_THEATRE: ${{ vars.BMS_THEATRE }}
          BMS_SCREEN: ${{ vars.BMS_SCREEN }}
          BMS_TIME: ${{ vars.BMS_TIME }}

          BMS_DEBUG: ${{ vars.BMS_DEBUG }}
          BMS_MIN_INTERVAL: ${{ vars.BMS_MIN_INTERVAL }}
          BMS_MAX_INTERVAL: ${{ vars.BMS_MAX_INTERVAL }}

          BMS_FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}

        run: |
          echo "============================================================"
          echo "BMS Ticket Checker"
          echo "UTC time: $(date -u '+%Y-%m-%d %H:%M:%S %Z')"
          echo "IST time: $(TZ=Asia/Kolkata date '+%Y-%m-%d %H:%M:%S %Z')"
          echo "Trigger: ${{ github.event_name }}"
          echo "Branch: ${GITHUB_REF_NAME}"
          echo "============================================================"

          uv run --with requests --with curl_cffi main.py

      - name: Commit updated state
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add bms_state.json bms_schedule.json

          if ! git diff --cached --quiet; then
            git commit -m "chore: update BMS state and schedule [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
            echo "State and schedule successfully committed and pushed."
          else
            echo "No state changes to commit."
          fi
